<!doctype html>
<html lang="id">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="theme-color" content="#0f172a">
        <title>Offline - Kelola Keuangan</title>
        <style>
            body { margin: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f8fafc; color: #0f172a; }
            main { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
            section { max-width: 460px; border: 1px solid #e2e8f0; background: #fff; border-radius: 12px; padding: 28px; box-shadow: 0 12px 40px rgba(15, 23, 42, .08); }
            h1 { margin: 0 0 10px; font-size: 24px; }
            p { margin: 0; line-height: 1.6; color: #475569; }
        </style>
    </head>
    <body>
        <main>
            <section>
                <h1>Koneksi offline</h1>
                <p>Data finansial bersifat online-first. Perubahan transaksi, hutang, tabungan, dan laporan akan disimpan ke database setelah koneksi tersedia kembali.</p>
            </section>
        </main>
    </body>
</html>
